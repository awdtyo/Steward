[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steward"
version = "0.1.0"
description = "Always-on AI operator for a Raspberry Pi 5 homelab."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
# Minimal deps to stay under 250 MB RAM. Do not add without documenting why.
dependencies = [
  "fastapi>=0.115,<0.117",  # HTTP API + dashboard backend
  "uvicorn>=0.30,<0.35",  # ASGI server (no heavy framework)
  "docker>=7,<8",  # read-only Docker events/containers collector (no CLI parsing)
  "python-multipart>=0.0.18,<0.1",  # form parsing for dashboard approval POSTs
  "pyyaml>=6,<7",  # service definitions live in a YAML file (stdlib has no YAML parser)
]

[project.scripts]
steward = "steward.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<0.29",  # transport for FastAPI TestClient in dashboard tests
]

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
